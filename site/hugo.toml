baseURL = 'http://localhost/'
title = "Anlu's Dotfiles"
copyright = "[Andy Luo](https://anlu.me) — [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)"

# Hugo module imports (theme fetched via Go module proxy)
[module]
[[module.imports]]
  path = 'github.com/alex-shpak/hugo-book'

# Book configuration
disablePathToLower = true
enableGitInfo = true

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 1

[markup.highlight]
  style = 'monokailight'

# Theme parameters
[params]
  BookTheme = 'light'
  BookSection = '*'
  BookSearch = true
  BookComments = false
  BookPortableLinks = false
  BookServiceWorker = 'precache'
  BookTranslatedOnly = false
